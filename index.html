<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Sistem Absensi Digital Guru - Mobile Formal Edition Professional">
    <meta name="robots" content="index, follow">
    <meta name="author" content="Dev Team Enterprise">
    <title>Absensi Digital Guru</title>
    
    <!-- Link Core Stylesheet -->
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    
    <!-- Framework & UI Support Eksternal -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    
    <!-- Google Fonts Premium Integration -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body class="bg-[#050505] text-white font-['Inter'] antialiased selection:bg-[#c5a059] selection:text-black">

    <!-- ========================================================================== -->
    <!-- 1. LOADING SCREEN SYSTEM                                                   -->
    <!-- ========================================================================== -->
    <div id="loader" class="fixed inset-0 bg-black flex flex-col items-center justify-center z-[9999] transition-all duration-500">
        <div class="spinner mb-4"></div>
        <h2 class="text-[#c5a059] font-semibold tracking-[0.3em] uppercase text-[10px] animate-pulse">
            Menginisialisasi Enjin Absensi...
        </h2>
    </div>

    <!-- ========================================================================== -->
    <!-- 2. LANDING PAGE INTERFACE (FORMAL MOBILE VIEW)                             -->
    <!-- ========================================================================== -->
    <div id="landing-page" class="min-h-screen flex items-center justify-center p-4 bg-gradient-to-b from-[#050505] to-[#0c0c0c]">
        <div class="card-premium w-full max-w-sm text-center p-8 border border-[#c5a059]/20 shadow-[0_20px_50px_rgba(0,0,0,0.8)] backdrop-blur-md bg-[#0f0f0f]/90">
            
            <!-- Ikon Sidik Jari / Keamanan Universal -->
            <div class="mb-6 flex justify-center">
                <div class="p-4 bg-[#141414] rounded-full border border-[#c5a059]/10 shadow-inner">
                    <svg class="w-14 h-14 text-[#c5a059]" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.2" d="M12 11c0 3.517-1.009 6.799-2.753 9.571m-3.44-2.04l.054-.09A13.916 13.916 0 009 11.5V10m.458-4.11a3.5 3.5 0 116.084 3.12 3.5 3.5 0 01-6.084-3.12zM22 4v16M2 4v16m4-16h12M4 20h16"></path>
                    </svg>
                </div>
            </div>
            
            <!-- Judul Modul -->
            <h1 class="text-2xl font-black text-[#c5a059] tracking-wider mb-1 uppercase">ABSENSI DIGITAL</h1>
            <h2 class="text-base font-medium tracking-[0.25em] mb-10 text-slate-400 uppercase">GURU & STAF</h2>
            
            <!-- Aksi Utama -->
            <div class="space-y-4">
                <button onclick="showDashboard()" class="btn-primary w-full rounded-xl py-4 text-sm font-bold tracking-[0.15em] uppercase shadow-lg shadow-[#c5a059]/5 active:scale-[0.98]">
                    MASUK SISTEM
                </button>
                
                <div class="pt-6 border-t border-slate-900">
                    <p onclick="loginAdmin()" class="text-[11px] text-slate-500 cursor-pointer hover:text-[#c5a059] transition-colors duration-300 uppercase tracking-widest font-semibold">
                        Akses Pengelola Portal
                    </p>
                </div>
            </div>
            
        </div>
    </div>

    <!-- ========================================================================== -->
    <!-- 3. MAIN APPLICATION INTERFACE (FORMAL MOBILE PORTRAIT)                     -->
    <!-- ========================================================================== -->
    <div id="app-container" class="hidden min-h-screen flex flex-col max-w-md mx-auto bg-[#0f0f0f] border-x border-slate-900 pb-24 shadow-2xl relative">
        
        <!-- Header Panel Navigasi Atas -->
        <header class="flex justify-between items-center bg-black p-5 border-b border-slate-900 sticky top-0 z-40 backdrop-blur-md bg-black/90">
            <div class="flex items-center gap-3">
                <div class="w-2 h-8 bg-[#c5a059] rounded-full"></div>
                <div>
                    <h2 id="page-title" class="text-sm font-extrabold text-[#c5a059] uppercase tracking-wider">Dashboard</h2>
                    <p class="text-[9px] text-slate-500 uppercase tracking-widest font-bold">Aplikasi Mobile Guru</p>
                </div>
            </div>
            <div id="clock" class="font-mono text-xs text-slate-300 bg-[#141414] px-3 py-2 rounded-lg border border-slate-800 shadow-inner tracking-wider">
                00:00:00
            </div>
        </header>

        <!-- Area Konten Dinamis -->
        <main class="flex-1 p-5 overflow-y-auto">
            <section id="content-area" class="space-y-4 fade-in min-h-[400px]">
                <!-- Seluruh interface halaman di-render secara dinamis lewat script.js -->
            </section>
        </main>

        <!-- Navigasi Bar Bawah Berbasis Mobile Aplikasi Formal -->
        <nav class="fixed bottom-0 left-0 right-0 max-w-md mx-auto bg-black border-t border-slate-900 flex justify-around items-center p-3 z-50 shadow-[0_-10px_30px_rgba(0,0,0,0.7)]">
            
            <button onclick="renderPage('dashboard')" class="flex flex-col items-center justify-center gap-1.5 text-slate-400 hover:text-[#c5a059] focus:text-[#c5a059] transition-all duration-200 group w-16">
                <div class="text-xl group-hover:scale-110 transition-transform">📊</div>
                <span class="text-[9px] font-bold uppercase tracking-wider block">Status</span>
            </button>
            
            <button onclick="renderPage('absen')" class="flex flex-col items-center justify-center gap-1.5 text-slate-400 hover:text-[#c5a059] focus:text-[#c5a059] transition-all duration-200 group w-16">
                <div class="text-xl group-hover:scale-110 transition-transform">📷</div>
                <span class="text-[9px] font-bold uppercase tracking-wider block">Pindai</span>
            </button>
            
            <button onclick="renderPage('data-guru')" class="flex flex-col items-center justify-center gap-1.5 text-slate-400 hover:text-[#c5a059] focus:text-[#c5a059] transition-all duration-200 group w-16">
                <div class="text-xl group-hover:scale-110 transition-transform">👥</div>
                <span class="text-[9px] font-bold uppercase tracking-wider block">Data</span>
            </button>
            
            <button onclick="logout()" class="flex flex-col items-center justify-center gap-1.5 text-red-500/70 hover:text-red-500 transition-all duration-200 group w-16">
                <div class="text-xl group-hover:scale-110 transition-transform">By</div>
                <span class="text-[9px] font-bold uppercase tracking-wider block">Keluar</span>
            </button>
            
        </nav>
    </div>

    <!-- ========================================================================== -->
    <!-- 4. CORE ENGINE CORE MODAL INTERFACE                                       -->
    <!-- ========================================================================== -->
    <div id="global-modal" class="hidden fixed inset-0 bg-black/95 z-[9999] flex items-center justify-center p-4 backdrop-blur-md transition-all duration-300">
        <div class="bg-[#111111] border border-[#c5a059]/30 rounded-2xl p-6 w-full max-w-sm shadow-2xl transform transition-all duration-300 scale-100">
            <div class="flex items-center gap-2 mb-4 pb-3 border-b border-slate-900">
                <div class="w-1.5 h-5 bg-[#c5a059] rounded-full"></div>
                <h3 id="modal-title" class="text-sm font-extrabold text-[#c5a059] uppercase tracking-wider">
                    Form Registrasi
                </h3>
            </div>
            <div id="modal-body" class="space-y-4 text-xs text-slate-300">
                <!-- Input field dinamis dimuat dari controller eksternal -->
            </div>
            <div class="flex gap-3 mt-6 pt-4 border-t border-slate-900">
                <button onclick="closeModal()" class="flex-1 py-3 bg-slate-900 text-slate-400 rounded-lg font-bold uppercase tracking-widest text-[10px] hover:bg-slate-800 transition">
                    Batal
                </button>
                <button id="modal-submit-btn" class="flex-1 py-3 bg-[#c5a059] text-black rounded-lg font-black uppercase tracking-widest text-[10px] hover:bg-white transition shadow-md">
                    Simpan
                </button>
            </div>
        </div>
    </div>

    <!-- ========================================================================== -->
    <!-- 5. FIREBASE ENGINE & BACKEND STACK INFRASTRUCTURE                         -->
    <!-- ========================================================================== -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script src="script.js"></script>
    
    <!-- Inline Script Controllers -->
    <script>
        /**
         * Mengalihkan state UI dari Landing Page ke Aplikasi Utama
         */
        function showDashboard() {
            const landing = document.getElementById('landing-page');
            const appContainer = document.getElementById('app-container');
            
            if(landing && appContainer) {
                landing.classList.add('hidden');
                appContainer.classList.remove('hidden');
                // Panggil render default dashboard dari script.js
                if(typeof renderPage === 'function') {
                    renderPage('dashboard');
                }
            }
        }
        
        /**
         * Membuka otentikasi pengelola menggunakan SweetAlert2 formal
         */
        function loginAdmin() {
            Swal.fire({ 
                title: 'Otentikasi Pengelola', 
                text: 'Gunakan kata sandi hak akses administrator',
                input: 'password', 
                inputPlaceholder: 'Sandi Akses',
                confirmButtonText: 'Verifikasi',
                confirmButtonColor: '#c5a059',
                cancelButtonText: 'Kembali',
                showCancelButton: true,
                background: '#141414',
                color: '#fff',
                customClass: {
                    popup: 'border border-slate-800 rounded-2xl',
                    confirmButton: 'rounded-lg text-xs font-bold tracking-widest px-6 py-3',
                    cancelButton: 'rounded-lg text-xs font-bold tracking-widest px-6 py-3'
                }
            });
        }
        
        /**
         * Menutup global modal system secara manual
         */
        function closeModal() {
            const modal = document.getElementById('global-modal');
            if(modal) modal.classList.add('hidden');
        }
    </script>

</body>
</html>
