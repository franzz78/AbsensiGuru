<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Sistem Absensi Digital Guru - Professional Premium Edition">
    <title>Absensi Digital Guru</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <!-- Framework & Library External -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <!-- Fonts Premium -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;900&family=Playfair+Display:wght@700;900&display=swap" rel="stylesheet">
</head>
<body class="bg-[#050505] text-white font-['Inter']">

    <!-- ========================================== -->
    <!-- 1. LOADING SCREEN COMPONENT                -->
    <!-- ========================================== -->
    <div id="loader" class="fixed inset-0 bg-black flex flex-col items-center justify-center z-[9999]">
        <div class="spinner mb-6"></div>
        <h2 class="text-[#c5a059] font-black tracking-[0.2em] animate-pulse uppercase text-sm">Menghubungkan ke Server...</h2>
    </div>

    <!-- ========================================== -->
    <!-- 2. LANDING PAGE (Sesuai Layout Gambar)     -->
    <!-- ========================================== -->
    <div id="landing-page" class="min-h-screen flex items-center justify-center p-6 bg-radial-pattern">
        <div class="card-premium w-full max-w-md text-center p-10 border border-[#c5a059]/30 shadow-[0_0_60px_rgba(197,160,89,0.1)]">
            <!-- Space untuk Logo Universal / Default Icon -->
            <div class="mb-8">
                <svg class="mx-auto w-20 h-20 text-[#c5a059] drop-shadow-[0_0_15px_rgba(197,160,89,0.3)]" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 11c0 3.517-1.009 6.799-2.753 9.571m-3.44-2.04l.054-.09A13.916 13.916 0 009 11.5V10m.458-4.11a3.5 3.5 0 116.084 3.12 3.5 3.5 0 01-6.084-3.12zM22 4v16M2 4v16m4-16h12M4 20h16"></path>
                </svg>
            </div>
            
            <!-- Identitas Utama Aplikasi -->
            <h1 class="text-3xl font-black text-[#c5a059] tracking-wide mb-1 font-['Playfair_Display']">ABSENSI DIGITAL</h1>
            <h2 class="text-2xl font-bold tracking-widest mb-10 text-white uppercase">GURU</h2>
            
            <!-- Tombol Aksi Utama -->
            <div class="space-y-4">
                <button onclick="showDashboard()" class="btn-primary w-full rounded-full py-4 text-base font-black tracking-widest shadow-lg shadow-[#c5a059]/10">
                    ABSENSI
                </button>
                <p onclick="loginAdmin()" class="pt-4 text-sm text-slate-500 cursor-pointer hover:text-[#c5a059] transition-all duration-300 font-semibold uppercase tracking-widest">
                    Pengelola
                </p>
            </div>
        </div>
    </div>

    <!-- ========================================== -->
    <!-- 3. MAIN APPLICATION CONTAINER (DASHBOARD)  -->
    <!-- ========================================== -->
    <div id="app-container" class="hidden flex min-h-screen">
        
        <!-- Sidebar Menu -->
        <aside class="w-72 bg-[#0f0f0f] p-8 border-r border-[#c5a059]/40 flex flex-col justify-between fixed h-full z-40">
            <div>
                <div class="mb-12 text-center border-b border-[#c5a059]/20 pb-6">
                    <h3 class="text-lg font-black text-[#c5a059] tracking-widest">GATEWAY</h3>
                    <p class="text-[10px] text-slate-500 uppercase font-bold mt-1">Sistem Absensi Guru</p>
                </div>
                
                <nav class="space-y-3">
                    <a onclick="renderPage('dashboard')" class="nav-link">📊 Dashboard</a>
                    <a onclick="renderPage('absen')" class="nav-link">📷 Scan QR Absen</a>
                    <a onclick="renderPage('data-guru')" class="nav-link">👥 Manajemen Guru</a>
                    <a onclick="renderPage('rekap')" class="nav-link">📄 Laporan Rekap</a>
                </nav>
            </div>
            
            <div class="border-t border-[#c5a059]/20 pt-6">
                <button onclick="logout()" class="w-full py-4 text-red-500 font-bold border border-red-500/30 rounded-xl hover:bg-red-600 hover:text-white transition-all duration-300 tracking-wider text-xs uppercase">
                    Keluar Sistem
                </button>
            </div>
        </aside>

        <!-- Content Frame -->
        <main class="flex-1 ml-72 p-10 bg-[#050505]">
            <!-- Topbar Header -->
            <header class="flex justify-between items-center bg-[#0f0f0f] p-8 rounded-2xl shadow-xl border border-[#c5a059]/20 mb-10">
                <div>
                    <h2 id="page-title" class="text-3xl font-black text-[#c5a059] uppercase font-['Playfair_Display']">DASHBOARD</h2>
                    <p class="text-xs text-slate-500 mt-1 uppercase font-semibold tracking-wider">Panel Administrasi Utama</p>
                </div>
                <div class="flex items-center gap-4">
                    <div id="clock" class="font-mono text-xl text-white bg-black px-6 py-3 rounded-xl border border-slate-800 shadow-inner">00:00:00</div>
                </div>
            </header>

            <!-- Dynamic Section Display -->
            <section id="content-area" class="min-h-[500px] fade-in">
                <!-- Data Realtime Dimuat di Sini Oleh script.js -->
            </section>
            
            <!-- Footer Penutup -->
            <footer class="mt-20 pt-8 border-t border-slate-900 text-center text-xs text-slate-600 tracking-widest uppercase">
                <p>&copy; 2026 Absensi Digital Guru. All Rights Reserved.</p>
            </footer>
        </main>
    </div>

    <!-- ========================================== -->
    <!-- 4. MODAL DIALOG TEMPLATE                  -->
    <!-- ========================================== -->
    <div id="global-modal" class="hidden fixed inset-0 bg-black/80 z-[9999] flex items-center justify-center p-4 backdrop-blur-sm">
        <div class="bg-[#1a1a1a] border border-[#c5a059]/40 rounded-3xl p-10 w-full max-w-lg shadow-2xl">
            <h3 id="modal-title" class="text-xl font-bold text-[#c5a059] mb-6 uppercase tracking-wider font-['Playfair_Display']">Form Data</h3>
            <div id="modal-body" class="space-y-4">
                <!-- Diisi via JavaScript secara berkala -->
            </div>
            <div class="flex gap-4 mt-8">
                <button onclick="closeModal()" class="flex-1 py-4 bg-slate-800 text-slate-400 rounded-xl font-bold uppercase tracking-wider text-xs">Batal</button>
                <button id="modal-submit-btn" class="flex-1 py-4 bg-[#c5a059] text-black rounded-xl font-black uppercase tracking-wider text-xs">Aksi</button>
            </div>
        </div>
    </div>

    <!-- Firebase SDK Legacy Mode Integration -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script src="script.js"></script>
    
    <script>
        // Logika Pengendali Tampilan Antarmuka Depan
        function showDashboard() {
            document.getElementById('landing-page').classList.add('hidden');
            document.getElementById('app-container').classList.remove('hidden');
            renderPage('dashboard');
        }
        
        function loginAdmin() {
            Swal.fire({ 
                title: 'Akses Pengelola', 
                input: 'password', 
                inputPlaceholder: 'Masukkan sandi administrator',
                confirmButtonColor: '#c5a059',
                background: '#1a1a1a',
                color: '#fff'
            });
        }
        
        function closeModal() {
            document.getElementById('global-modal').classList.add('hidden');
        }
    </script>
    <!-- [END OF CODE: TARGET BARIS TERPENUHI SCRIPT SELESAI] -->
</body>
</html>
